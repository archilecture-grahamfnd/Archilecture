<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture Map</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: white;
      color: #111;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    header a {
      color: #111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px);
      background: #f7f7f7;
    }

    .popup-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .popup-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #111;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">archiLECTURE</a>
  <a href="index.html">MENU</a>
</header>

<div id="map"></div>

<script>
  const map = L.map("map", {
    zoomControl: true
  }).setView([39.5, -98.35], 4);

  // Optional minimal base map
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let lectureCounts = {};

  Promise.all([
    loadCSV("Library.csv"),
    fetch("institutions.geojson").then(response => response.json())
  ]).then(([csvData, geojson]) => {
    lectureCounts = countLecturesBySchool(csvData);
    drawInstitutionMap(geojson, lectureCounts);
  });

  function loadCSV(path) {
    return new Promise(resolve => {
      Papa.parse(path, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data.map(row => {
            const normalized = {};

            Object.keys(row).forEach(key => {
              normalized[key.trim().toLowerCase()] = row[key];
            });

            return normalized;
          });

          resolve(data);
        }
      });
    });
  }

  function countLecturesBySchool(data) {
    const counts = {};

    data.forEach(row => {
      if (!row.school) return;

      String(row.school)
        .split(";")
        .map(school => cleanName(school))
        .filter(Boolean)
        .forEach(school => {
          counts[school] = (counts[school] || 0) + 1;
        });
    });

    return counts;
  }

  function drawInstitutionMap(geojson, counts) {
    L.geoJSON(geojson, {
      pointToLayer: function(feature, latlng) {
        const institution = cleanName(feature.properties.Institution);
        const count = counts[institution] || 0;

        if (count === 0) return null;

        return L.circleMarker(latlng, {
          radius: getRadius(count),
          fillColor: "#111",
          color: "#111",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.65
        });
      },

      onEachFeature: function(feature, layer) {
        const institution = cleanName(feature.properties.Institution);
        const count = counts[institution] || 0;

        if (count === 0) return;

        layer.bindPopup(`
          <div class="popup-title">${institution}</div>
          <div>${count} lecture${count === 1 ? "" : "s"}</div>
          <div class="popup-link" onclick="goToSchool('${escapeForJS(institution)}')">
            View lectures
          </div>
        `);
      }
    }).addTo(map);
  }

  function getRadius(count) {
    return Math.max(5, Math.sqrt(count) * 6);
  }

  function cleanName(value) {
    return String(value || "")
      .trim()
      .replace(/\s+/g, " ");
  }

  function goToSchool(school) {
    window.location.href =
      `results.html?search=${encodeURIComponent(school)}`;
  }

  function escapeForJS(str) {
    return String(str)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }
</script>

</body>
</html>
