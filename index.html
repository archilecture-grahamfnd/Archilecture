<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>archiLECTURE</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 60px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    header h1 {
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    nav button {
      border: none;
      background: none;
      font-size: 12px;
      cursor: pointer;
    }

    /* MENU */
    .archive-menu {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      min-height: 420px;
      background: white;
      border-bottom: 1px solid #ccc;
      display: none;
      grid-template-columns: 320px 1fr;
      z-index: 1500;
    }

    .archive-menu.active {
      display: grid;
    }

    .menu-left {
      background: #eee;
      padding: 20px;
    }

    .menu-left div {
      padding: 12px 0;
      font-size: 14px;
      cursor: pointer;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .menu-left div.active {
      color: #111;
    }

    .menu-right {
      padding: 20px;
      columns: 3;
      column-gap: 60px;
    }

    .menu-right div {
      break-inside: avoid;
      font-size: 14px;
      line-height: 1.7;
      cursor: pointer;
      text-transform: uppercase;
    }

    .menu-right div:hover {
      text-decoration: underline;
    }

    .special-menu-option {
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ddd;
    }

    /* GRID */
    .container {
      margin-top: 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2px;
    }

    .item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #eee;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .item:hover img {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.9);
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .item:hover .overlay {
      opacity: 1;
    }
  </style>
</head>

<body>

<header>
  <h1>archiLECTURE</h1>
  <nav>
    <button id="menuToggle">MENU</button>
  </nav>
</header>

<!-- MENU -->
<div class="archive-menu" id="archiveMenu">
  <div class="menu-left" id="filterHeaders"></div>
  <div class="menu-right" id="filterValues"></div>
</div>

<!-- GRID -->
<div class="container" id="grid"></div>

<script>
  const grid = document.getElementById("grid");
  const menu = document.getElementById("archiveMenu");
  const menuToggle = document.getElementById("menuToggle");
  const filterHeaders = document.getElementById("filterHeaders");
  const filterValues = document.getElementById("filterValues");

  let allData = [];
  let activeHeader = "topic";

  const filterableHeaders = [
    "presenter-index",
    "school",
    "date",
    "topic",
    "based",
    "disciplinary"
  ];

  Papa.parse("Library.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

      allData = results.data.map((row, index) => {
        const normalized = { id: index };

        Object.keys(row).forEach(key => {
          normalized[key.trim().toLowerCase()] = row[key];
        });

        return normalized;
      }).filter(d => d.title && d.link);

      buildHeaderMenu();
      populateFilterValues(activeHeader);
      renderGrid(allData);
    }
  });

  menuToggle.addEventListener("click", () => {
    menu.classList.toggle("active");
  });

  function buildHeaderMenu() {
    filterHeaders.innerHTML = "";

    filterableHeaders.forEach(header => {
      const div = document.createElement("div");
      div.className = header === activeHeader ? "active" : "";

      div.innerHTML = `
        <span>${formatLabel(header)}</span>
        <span>›</span>
      `;

      div.onclick = () => {

        if (header === "presenter-index") {
          window.location.href = "architects.html";
          return;
        }

        activeHeader = header;

        document.querySelectorAll(".menu-left div")
          .forEach(el => el.classList.remove("active"));

        div.classList.add("active");
        populateFilterValues(header);
      };

      filterHeaders.appendChild(div);
    });
  }

  function populateFilterValues(header) {
    filterValues.innerHTML = "";

    if (header === "school") {
      const mapOption = document.createElement("div");
      mapOption.textContent = "MAP OF SCHOOLS";
      mapOption.className = "special-menu-option";

      mapOption.onclick = () => {
        window.location.href = "map.html";
      };

      filterValues.appendChild(mapOption);
    }

    let values;

    if (header === "date") {
      values = [...new Set(
        allData.flatMap(row => {
          if (!row.date) return [];

          const date = new Date(row.date);
          if (isNaN(date)) return [];

          const year = date.getFullYear();
          const month = date.getMonth();
          const half = month <= 5 ? "January–June" : "July–December";

          return [`${year} / ${half}`];
        })
      )].sort().reverse();

    } else {
      values = [...new Set(
        allData.flatMap(row => {
          if (!row[header]) return [];

          return String(row[header])
            .split(";")
            .map(v => v.trim())
            .filter(Boolean);
        })
      )].sort();
    }

    values.forEach(value => {
      const div = document.createElement("div");
      div.textContent = value;

      div.onclick = () => {
        window.location.href =
          `results.html?filter=${encodeURIComponent(header)}&value=${encodeURIComponent(value)}`;
      };

      filterValues.appendChild(div);
    });
  }

  function renderGrid(data) {
    grid.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "item";

      const videoId = getYouTubeId(item.link);
      const thumb = videoId
        ? `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
        : "";

      div.innerHTML = `
        <img src="${thumb}" />
        <div class="overlay">
          <strong>${item.title}</strong><br>
          ${item.architect || ""}<br>
          ${item.school || ""}
        </div>
      `;

      div.onclick = () => {
        window.location.href = `video.html?id=${item.id}`;
      };

      grid.appendChild(div);
    });
  }

  function getYouTubeId(url) {
    const match = String(url).match(/[?&]v=([^&]+)/);
    return match ? match[1] : null;
  }

  function formatLabel(text) {
    if (text === "architect-index") return "ARCHITECTS";
    return text.replace(/-/g, " ").toUpperCase();
  }
</script>

</body>
</html>
